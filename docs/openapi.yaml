            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '409':
          description: 幂等冲突、终态、证据状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: 证据或输入未满足业务条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '429':
          description: 队列/容量已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议等待秒数；重试同一请求/帧，不新造幂等键
        '500':
          description: 请求错误或服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          description: 未就绪、未配置模型、排空或可重试存储故障
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议等待秒数；重试同一请求/帧，不新造幂等键
        '507':
          description: 临界磁盘或帧存储容量不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议等待秒数；重试同一请求/帧，不新造幂等键
