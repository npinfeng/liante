openapi: 3.1.0
info:
  title: 联特科技工业多模态检测 API
  version: 2.0.0
  description: 实际 Flask 操作数 62，不含自动 HEAD/OPTIONS。Stage1/Stage3 模型 NOT CONFIGURED。
servers:
- url: http://localhost:8000
  description: 按部署 profile 修改主机和端口
paths:
  /:
    get:
      operationId: root_get
      summary: 旧服务入口
      description: 返回服务链接与旧状态。
      tags:
      - 其他已有接口
      x-roles:
      - admin
      - operator
      x-source: backend_server.py:299
      x-asynchronous: false
      x-idempotency: read
      parameters:
      - name: X-Liante-Role
        in: header
        schema:
          type: string
          enum:
          - admin
          - operator
          - device
        description: Bearer 身份角色，默认 device；Basic 用户名为角色
      - name: X-Liante-Device-ID
        in: header
        schema:
          type: string
          maxLength: 128
        description: 设备调用必须提供独立已配置设备 ID
      responses:
        '200':
          description: 成功；需满足实际业务条件
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
                service: Liante MLP AutoML
                prediction_gui: /gui/index.html
                automl_gui: /gui/train.html
        '400':
          description: 请求错误或服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: INVALID_ARGUMENT
                message: 请求未满足接口条件
                data: {}
                request_id: request-001
                timestamp: '2026-10-01T00:00:00Z'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '403':
          description: 角色或资源归属拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          description: 资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '409':
          description: 幂等冲突、终态、证据状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '422':
          description: 证据或输入未满足业务条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '429':
          description: 队列/容量已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            Retry-After:
              schema:
                type: integer
              description: 建议等待秒数；重试同一请求/帧，不新造幂等键
        '500':
          description: 请求错误或服务器错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          description: 未就绪、未配置模型、排空或可重试存储故障
