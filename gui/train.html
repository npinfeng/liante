<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liante MLP AutoML</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --card:#101d2f; --line:#253752; --text:#e8eef7; --muted:#95a7bf; --blue:#5d8cff; --green:#39d7a0; --red:#ff7070; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.55 Inter,system-ui,sans-serif; background:radial-gradient(circle at 20% 0,#13294d 0,transparent 35%),var(--bg); color:var(--text); }
    header,main { width:min(1120px,calc(100% - 32px)); margin:auto; }
    header { display:flex; align-items:center; justify-content:space-between; padding:28px 0 18px; }
    h1,h2,h3,p { margin-top:0; } h1 { font-size:24px; } h2 { font-size:17px; }
    a { color:#adc5ff; text-decoration:none; }
    .grid { display:grid; grid-template-columns:360px 1fr; gap:18px; padding-bottom:40px; }
    .card { background:rgba(16,29,47,.94); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:0 18px 50px #0004; }
    .stack { display:grid; gap:15px; }
    label { color:var(--muted); font-size:13px; display:block; margin-bottom:6px; }
    input,select,textarea,button { width:100%; border-radius:9px; border:1px solid var(--line); background:#091524; color:var(--text); padding:10px 12px; font:inherit; }
    textarea { min-height:275px; resize:vertical; font:12px/1.45 ui-monospace,monospace; }
    button { background:linear-gradient(135deg,#4a77ef,#795cf2); border:0; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .tabs { display:flex; gap:8px; }
    .tabs button { background:#0a1728; border:1px solid var(--line); }
    .tabs button.active { background:#254b91; border-color:#5d8cff; }
    .hidden { display:none; }
    .status { display:flex; justify-content:space-between; gap:12px; padding:12px 0; }
    .pill { padding:3px 9px; border-radius:99px; background:#17304d; color:#bcd5fb; font-size:12px; }
    .bar { height:10px; border-radius:99px; overflow:hidden; background:#07101c; border:1px solid var(--line); }
    .bar span { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .25s; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .metric { background:#0a1728; border:1px solid var(--line); border-radius:10px; padding:12px; }
    .metric b { display:block; font-size:18px; color:#dce8ff; }
    .muted { color:var(--muted); }
    pre { white-space:pre-wrap; word-break:break-word; background:#07101c; border:1px solid var(--line); border-radius:10px; padding:14px; min-height:160px; max-height:320px; overflow:auto; }
    #network { font-size:22px; color:var(--green); font-weight:800; letter-spacing:.5px; }
    @media(max-width:800px){ .grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr} }
  </style>
</head>
<body>
  <header>
    <div><h1>Liante MLP AutoML</h1><div class="muted">固定模型 MLP · 自动搜索网络结构与训练超参数</div></div>
    <a href="/gui/index.html">前往预测 →</a>
  </header>
  <main class="grid">
    <section class="card stack">
      <div class="tabs">
        <button id="simple-tab" class="active" onclick="setMode(false)">简单模式</button>
        <button id="advanced-tab" onclick="setMode(true)">高级模式</button>
      </div>
      <div>
        <label for="channel">Channel</label>
        <select id="channel">
          <option value="0">Channel 0</option><option value="1">Channel 1</option>
          <option value="2">Channel 2</option><option value="3">Channel 3</option>
          <option value="4">Channel 4</option><option value="5">Channel 5</option>
          <option value="6">Channel 6</option><option value="7">Channel 7</option>
        </select>
      </div>
      <label><input id="train-all" type="checkbox" style="width:auto;margin-right:8px">依次训练 Channel 0–7（GPU 并发默认 1）</label>
      <div id="advanced" class="hidden stack">
        <div class="row">
          <div><label for="trials">Trials</label><input id="trials" type="number" min="1" max="500" value="30"></div>
          <div><label for="epochs">Max epochs</label><input id="epochs" type="number" min="1" max="10000" value="500"></div>
        </div>
        <div><label for="patience">Early stopping patience</label><input id="patience" type="number" min="1" value="40"></div>
        <div><label for="space">搜索空间 JSON</label><textarea id="space">{
  "n_layers": [1, 5],
  "hidden_sizes": [32, 64, 128, 256, 512],
  "activations": ["relu", "gelu", "silu", "tanh"],
  "dropout": [0.0, 0.5],
  "batch_norm": [true, false],
  "optimizers": ["Adam", "AdamW", "SGD"],
  "learning_rate": [0.00001, 0.01],
  "weight_decay": [0.000001, 0.01],
  "batch_sizes": [16, 32, 64, 128, 256],
  "schedulers": ["none", "cosine", "plateau"]
}</textarea></div>
      </div>
      <button id="start" onclick="startTraining()">开始 AutoML</button>
      <div class="muted">简单模式使用 30 trials、500 epochs、patience 40 和完整默认搜索空间。</div>
    </section>

    <section class="stack">
      <div class="card">
        <div class="status"><div><b id="status">idle</b><div id="message" class="muted">等待开始训练</div></div><span class="pill" id="trial">Trial 0/0</span></div>
        <div class="bar"><span id="progress"></span></div>
        <div class="status"><span id="progress-text">0%</span><span>Best validation MSE: <b id="best">—</b></span></div>
      </div>
      <div class="card hidden" id="result-card">
        <h2>最佳 MLP</h2>
        <div id="network"></div>
        <p id="params" class="muted"></p>
        <h3>EA 测试集指标</h3><div class="metrics" id="ea-metrics"></div>
        <h3 style="margin-top:18px">Bias 测试集指标</h3><div class="metrics" id="bias-metrics"></div>
      </div>
      <div class="card"><h2>训练信息</h2><pre id="log">尚无任务。</pre></div>
    </section>
  </main>
<script>
  let advanced = false, timer = null, taskId = null;
  function setMode(value){
    advanced=value; document.getElementById('advanced').classList.toggle('hidden',!value);
    document.getElementById('simple-tab').classList.toggle('active',!value);
    document.getElementById('advanced-tab').classList.toggle('active',value);
  }
  function body(){
    const all=document.getElementById('train-all').checked;
    const result=all?{channels:[0,1,2,3,4,5,6,7]}:{channel:Number(document.getElementById('channel').value)};
    if(advanced){
      result.n_trials=Number(document.getElementById('trials').value);
      result.max_epochs=Number(document.getElementById('epochs').value);
      result.patience=Number(document.getElementById('patience').value);
      result.search_space=JSON.parse(document.getElementById('space').value);
    }
    return result;
  }
  async function startTraining(){
    let payload;
    try{payload=body()}catch(error){alert('搜索空间 JSON 无效：'+error.message);return}
    const all=document.getElementById('train-all').checked;
    document.getElementById('start').disabled=true;
    document.getElementById('result-card').classList.add('hidden');
    try{
      const response=await fetch(all?'/automl/train-all':'/automl/train',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const data=await response.json(); if(!response.ok)throw new Error(data.error||'无法创建任务');
      taskId=data.task_id; document.getElementById('log').textContent='task_id: '+taskId; poll();
    }catch(error){document.getElementById('start').disabled=false;alert(error.message)}
  }
  async function poll(){
    try{
      const response=await fetch('/automl/tasks/'+taskId); const task=await response.json();
      if(!response.ok)throw new Error(task.error||'状态查询失败');
      document.getElementById('status').textContent=task.status;
      document.getElementById('message').textContent=task.message;
      document.getElementById('trial').textContent=`Trial ${task.current_trial}/${task.total_trials}`;
      document.getElementById('progress').style.width=task.progress+'%';
      document.getElementById('progress-text').textContent=task.progress+'%';
      document.getElementById('best').textContent=task.best_score==null?'—':Number(task.best_score).toPrecision(6);
      document.getElementById('log').textContent=JSON.stringify(task,null,2);
      if(task.status==='completed'){await loadResult();document.getElementById('start').disabled=false;return}
      if(task.status==='failed'){document.getElementById('start').disabled=false;return}
      timer=setTimeout(poll,1000);
    }catch(error){document.getElementById('log').textContent=error.message;document.getElementById('start').disabled=false}
  }
  async function loadResult(){
    const response=await fetch('/automl/tasks/'+taskId+'/result'); const data=await response.json();
    document.getElementById('log').textContent=JSON.stringify(data,null,2);
    const result=data.channels?data.channels[data.channels.length-1]:data;
    showResult(result);
  }
  function showResult(result){
    if(!result||!result.model_config)return;
    const c=result.model_config,p=result.best_params;
    document.getElementById('network').textContent=[c.input_dim,...c.hidden_dims,c.output_dim].join(' → ');
    document.getElementById('params').textContent=`${c.activation} · dropout ${Number(c.dropout).toFixed(3)} · batch norm ${c.batch_norm} · ${p.optimizer} · lr ${Number(p.learning_rate).toExponential(3)} · batch ${p.batch_size}`;
    metrics('ea-metrics',result.metrics.ea); metrics('bias-metrics',result.metrics.bias);
    document.getElementById('result-card').classList.remove('hidden');
  }
  function metrics(id,values){
    document.getElementById(id).innerHTML=['mse','rmse','mae','r2'].map(key=>`<div class="metric"><span class="muted">${key.toUpperCase()}</span><b>${Number(values[key]).toPrecision(6)}</b></div>`).join('');
  }
</script>
</body>
</html>
