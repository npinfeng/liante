<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联特科技 · 管理中心</title>
<link rel="stylesheet" href="operations.css"></head><body>
<header><div><strong>联特科技 · 工业检测管理中心</strong><small>任务、产品、证据与运行状态</small></div><a href="index.html">返回三阶段工作台</a></header>
<nav aria-label="管理功能"><button data-view="status">系统状态</button><button data-view="history">任务历史</button><button data-view="trace">产品追溯</button><button data-view="evidence">合格证据</button><button data-view="reviews">人工复核</button><button data-view="logs">运行日志</button></nav>
<main><div id="notice" role="status" aria-live="polite"></div>
<section id="status" class="view"><h1>系统状态</h1><p>服务存活与各阶段模型就绪状态独立显示。</p><button id="refresh-status">刷新状态</button><div id="health-cards" class="cards"></div><details><summary>管理员运行信息</summary><button id="load-system-info">读取版本、数据库与容量</button><pre id="system-info">仅管理员可读取。</pre></details></section>
<section id="history" class="view" hidden><h1>任务历史</h1><form id="history-filter" class="filters"><label>产品编号<input name="product_id"></label><label>任务编号<input name="task_id"></label><label>阶段<select name="stage"><option value="">全部</option><option>stage1</option><option>stage2</option><option>stage3</option><option>automl</option></select></label><label>状态<select name="status"><option value="">全部</option><option>PENDING</option><option>QUEUED</option><option>RUNNING</option><option>COMPLETED</option><option>FAILED</option><option>CANCELLED</option><option>TIMEOUT</option><option>REVIEW_REQUIRED</option></select></label><label>通道<select name="channel"><option value="">全部</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label><label>来源编号<input name="source_id"></label><label>开始时间<input type="datetime-local" name="from_time"></label><label>结束时间<input type="datetime-local" name="to_time"></label><button>查询</button></form><div id="history-table" class="table"></div><div class="pager"><button id="history-prev">上一页</button><span id="history-page"></span><button id="history-next">下一页</button><button id="export-history">导出当前页 CSV</button></div><h2>选中任务</h2><pre id="task-detail">点击任务编号查看状态。</pre></section>
<section id="trace" class="view" hidden><h1>产品追溯</h1><form id="trace-form"><label>产品编号<input id="trace-product" required maxlength="200"></label><button>查询关联任务、AOI 产品、证据与复核</button></form><div id="trace-result"></div><div class="pager"><button id="trace-prev">上一页</button><span id="trace-page"></span><button id="trace-next">下一页</button><button id="export-trace">导出当前追溯页 JSON</button></div></section>
<section id="evidence" class="view" hidden><h1>合格证据管理</h1><form id="evidence-form"><label>产品编号<input id="evidence-product" maxlength="200"></label><button>查询证据历史</button></form><div id="evidence-table" class="table"></div><div class="pager"><button id="evidence-prev">上一页</button><span id="evidence-page"></span><button id="evidence-next">下一页</button></div><h2>证据详情与审计</h2><label>证据编号<input id="evidence-id" maxlength="32"></label><button id="get-evidence">读取证据与审计</button><pre id="evidence-detail"></pre><label>撤销 / 替换原因<input id="evidence-reason" maxlength="2000" placeholder="填写实际原因"></label><button id="revoke-evidence">撤销证据</button><button id="export-evidence">导出证据 JSON</button><details><summary>替换为新证据</summary><p>填写新的完整人工证据 JSON；仍会核对实际完成的上游任务、测量、身份和配方。</p><textarea id="replacement-payload" rows="10" placeholder='{"product_id":"...","aoi_task_id":"...","stage2_task_id":"...","recipe_id":"...","recipe_version":"...","optical_features":{},"electrical_features":{},"tuning_result":{},"manual_review":{}}'></textarea><button id="replace-evidence">提交替换</button></details></section>
<section id="reviews" class="view" hidden><h1>人工复核</h1><p>模型未配置时可登记复核说明；建议等级和最终等级保持为空。复核身份绑定当前登录账号，记录不可覆盖。</p><form id="review-form" class="filters"><label>产品编号<input name="product_id" required maxlength="200"></label><label>合格证据编号（可空）<input name="qualification_id" maxlength="32"></label><label>Stage3 任务编号（可空）<input name="stage3_task_id" maxlength="32"></label><label>复核决定<select name="decision"><option value="APPROVE">通过复核记录</option><option value="REJECT">退回复核</option></select></label><label>最终等级<select name="final_grade"><option value="">无等级</option><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>复核理由<textarea name="comment" required maxlength="2000"></textarea></label><button>保存复核记录</button></form><form id="review-search"><label>产品编号<input id="review-product"></label><button>读取复核历史</button></form><div id="review-table" class="table"></div><div class="pager"><button id="review-prev">上一页</button><span id="review-page"></span><button id="review-next">下一页</button></div></section>
<section id="logs" class="view" hidden><h1>分页运行日志</h1><form id="log-form"><label>任务编号 / 来源编号<input id="log-id" required></label><label>日志类型<select id="log-type"><option value="task">任务日志</option><option value="source">MES 来源日志</option></select></label><button>读取日志</button></form><div id="log-table" class="table"></div><div class="pager"><button id="log-prev">上一页</button><span id="log-page"></span><button id="log-next">下一页</button></div><p>每页最多 50 条，不把全部日志加载到浏览器。</p></section>
</main><script src="operations.js" defer></script></body></html>
